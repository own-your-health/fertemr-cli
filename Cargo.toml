[package]
name = "fertemr-cli"
description = "Unofficial read-only CLI for patient portals on the FERT fertility EMR (fertemr.com): results, visits, documents and messages as health-records/v1."
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/own-your-health/fertemr-cli"
authors = ["piekstra"]
publish = false

[lib]
name = "fertemr"
path = "src/lib.rs"

[[bin]]
name = "fertemr"
path = "src/main.rs"

[dependencies]
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2", features = ["reqwest"] }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
# `auth login --browser`: the portal's own sign-in page in the profile's Chrome.
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-med-records = { git = "https://github.com/own-your-health/medical-common", tag = "v0.6.2" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
